version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mysql://naano_user:naano_password@db:3306/naano_db
      - JWT_SECRET=naano_super_secret_session_jwt_key_2026_b2b_marketplace
      - NEXT_PUBLIC_APP_URL=${COOLIFY_FQDN:-http://localhost:3000}
      - PRISMA_AUTO_MIGRATE=true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: naano_root_password
      MYSQL_DATABASE: naano_db
      MYSQL_USER: naano_user
      MYSQL_PASSWORD: naano_password
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "naano_user", "-pnaano_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
